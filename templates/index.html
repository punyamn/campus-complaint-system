<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Issue Tracker</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-wrapper">
        <header class="navbar">
            <div class="logo">⚡ Campus<span>Fix</span></div>
            <a href="/admin" class="nav-link">Admin Dashboard →</a>
        </header>

        <main class="content-container">
            <div class="card">
                <div class="card-header">
                    <h2>Report a Campus Issue</h2>
                    <p>Submit facility, maintenance, or infrastructure problems directly to campus authorities.</p>
                </div>

                <form action="/submit" method="POST" class="styled-form">
                    <div class="form-group">
                        <label for="issue">Issue Description</label>
                        <textarea id="issue" name="issue" rows="3" placeholder="e.g. Ceiling fan rattling loudly in Room 302..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="location">Location / Building</label>
                        <input type="text" id="location" name="location" placeholder="e.g. Hostel Block B, Room 302" required>
                    </div>

                    <button type="submit" class="btn-submit">Submit Ticket</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
