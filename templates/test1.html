<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Complaint Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 480px; }
        h2 { color: #2c3e50; margin-bottom: 20px; text-align: center; }
        label { font-weight: 600; color: #34495e; display: block; margin-top: 15px; margin-bottom: 5px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px; }
        input[type="text"]:focus, textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; margin-top: 20px; background-color: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Submit a Complaint</h2>
        <form action="/submit" method="POST">
            <label for="issue">Complaint Details</label>
            <textarea id="issue" name="issue" placeholder="Describe the issue (e.g. fan not working)..." required></textarea>

            <label for="location">Location / Room No.</label>
            <input type="text" id="location" name="location" placeholder="e.g. Room 306, Block B" required>

            <button type="submit">Submit Complaint</button>
        </form>
    </div>
</body>
</html>
